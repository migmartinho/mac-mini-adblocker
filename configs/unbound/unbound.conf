# Unbound Configuration for mac-mini-adblocker
# ============================================================
# Place this file at: /opt/homebrew/etc/unbound/unbound.conf
#
# Unbound acts as a local recursive DNS resolver, listening
# on 127.0.0.1:5335.  AdGuard Home forwards non-blocked
# queries here; this file never sees external clients.
# ============================================================

server:

    # ── Network ───────────────────────────────────────────
    # Listen only on localhost; this service is not exposed
    # to the network.
    interface: 127.0.0.1
    port: 5335

    # Allow queries only from localhost (AdGuard Home).
    access-control: 127.0.0.1/32 allow
    access-control: 0.0.0.0/0    refuse
    access-control: ::0/0         refuse

    # ── Protocol ──────────────────────────────────────────
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # ── Root hints ────────────────────────────────────────
    # Path to the root hints file (IANA root zone delegation data).
    # Download with:
    #   curl -o /opt/homebrew/etc/unbound/root.hints \
    #        https://www.internic.net/domain/named.cache
    root-hints: /opt/homebrew/etc/unbound/root.hints

    # ── DNSSEC ────────────────────────────────────────────
    # Validate DNSSEC signatures.  Requires the trust anchor below.
    # auto-trust-anchor-file is managed automatically by Unbound.
    auto-trust-anchor-file: /opt/homebrew/etc/unbound/root.key

    # ── Privacy ───────────────────────────────────────────
    # Do not include the client's IP in queries to authoritative servers.
    hide-identity: yes
    hide-version: yes

    # Harden against DNSSEC stripping attacks.
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    harden-short-bufsize: yes
    harden-large-queries: yes

    # Use a randomly generated port for outgoing queries (not 53).
    # This makes cache-poisoning attacks harder.
    use-caps-for-id: yes

    # Refuse queries for local zones that should not be resolved publicly.
    private-address: 192.168.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # ── Performance ───────────────────────────────────────
    # Number of threads (set to number of CPU cores — M1 has 8).
    num-threads: 4

    # Message cache slabs (power of 2, ≤ num-threads).
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes — total memory budget is roughly:
    #   rrset-cache-size * 2 + msg-cache-size
    # 8 GB RAM Mac Mini can easily afford 128 MB total.
    rrset-cache-size: 64m
    msg-cache-size: 32m
    neg-cache-size: 4m

    # Prefetch popular entries before they expire.
    prefetch: yes
    prefetch-key: yes

    # ── TTL overrides ─────────────────────────────────────
    # Minimum TTL — avoid hammering authoritative servers for
    # domains with very low TTLs (e.g. CDN records).
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # ── Logging ───────────────────────────────────────────
    # Log to file.  Adjust verbosity:
    #   0 = no logging, 1 = errors only, 2 = more detail
    verbosity: 1
    use-syslog: no
    logfile: /opt/homebrew/var/log/unbound/unbound.log
    log-queries: no       # Set to yes for debugging; very verbose

    # ── Outgoing interface ────────────────────────────────
    # Use the primary network interface for outgoing recursive queries.
    # Leave empty to let the OS choose.
    # outgoing-interface: 0.0.0.0

    # ── Minimal responses ─────────────────────────────────
    # Strip unnecessary authority/additional sections from responses.
    minimal-responses: yes

    # ── Aggressive NSEC ───────────────────────────────────
    # Use NSEC/NSEC3 records to synthesise negative responses
    # without extra round trips.
    aggressive-nsec: yes

    # ── Module configuration ──────────────────────────────
    module-config: "validator iterator"

# ── Remote control (disabled for security) ────────────────
remote-control:
    control-enable: no
